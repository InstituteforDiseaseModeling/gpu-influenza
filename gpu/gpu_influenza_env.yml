name: gpuflu_v8
channels:
  - defaults

dependencies:
  - python=3.7
  - pip

  # Core scientific python
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn

  # Numerical libraries  
  - blas
  - mkl

  # Graphs/networks
  - networkx
  - pygraphviz 
  - pydot
  - gdal

  # Others
  - pyyaml

  # More dependencies (via pip)
  - pip:
    - jupyter
    - jupyter-core
    - jupyter-console
    - jupyter-client

